plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }

def signingProp = { String key -> localProperties.getProperty(key) ?: System.getenv(key) }

android {
    namespace 'tech.anl'

    compileSdkVersion 36

    defaultConfig {
        applicationId "io.github.madeye.serverbox"
        minSdkVersion 26
        targetSdkVersion 36

        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing: KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD come from
    // local.properties or the environment. Without a keystore, release builds stay unsigned.
    def keystoreFile = signingProp('KEYSTORE_PATH')?.with { file(it) }
    if (keystoreFile?.exists()) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword signingProp('KEYSTORE_PASSWORD')
                keyAlias signingProp('KEY_ALIAS')
                keyPassword signingProp('KEY_PASSWORD')
            }
        }
    }

    flavorDimensions "app"
    productFlavors {
        ServerBox {
            dimension "app"
            applicationId "io.github.madeye.serverbox"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            enableUnitTestCoverage false
            enableAndroidTestCoverage false
        }
        release {
            debuggable false
            minifyEnabled false
            if (keystoreFile?.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Google Play build: the release build minus what Play forbids. src/playRelease's manifest
        // strips the permissions and the library gates the matching features at run time (see
        // DeclaredPermissions); the library modules have no playRelease and use their release.
        playRelease {
            initWith release
            matchingFallbacks += 'release'
            if (keystoreFile?.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    bundle {
        density {
            // Different APKs are generated for devices with different screen densities; true by default.
            enableSplit true
        }
        abi {
            // Different APKs are generated for devices with different CPU architectures; true by default.
            enableSplit true
        }
        language {
            // This is disabled so that the App Bundle does NOT split the APK for each language.
            // We're gonna use the same APK for all languages.
            enableSplit false
        }
    }
    packagingOptions {
        jniLibs {
            // REVERTED to true (see git history for the failed attempt at false). Confirmed
            // live: with useLegacyPackaging=false, this device's PackageManager extracted
            // *nothing* to legacyNativeLibraryDir at all -- android:extractNativeLibs="true"
            // in the library module's manifest did not force extraction the way it's documented
            // to. Since busybox/proot/pulseaudio/etc. are "fake .so" executables that only
            // work by actually landing on disk (not by being mmap'd as real shared
            // libraries), useLegacyPackaging=false breaks every session outright. Getting
            // Play's 16KB-page-size compatibility without breaking this needs those
            // executables moved off the native-lib-extraction trick entirely (e.g. shipped as
            // assets and self-extracted to filesDir at startup) -- not attempted here.
            useLegacyPackaging true
            excludes += ['lib/armeabi/libsqlcipher.so', 'lib/mips64/libsqlcipher.so', 'lib/mips/libsqlcipher.so']
        }
    }

    // Every variant's APK is named serverbox.apk (debug and release land in separate output dirs).
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "serverbox.apk"
        }
    }

}

// UserLAnd VM/QEMU are no longer bundled with this app in any form (neither as a raw asset nor
// as a Play Asset Delivery pack) -- InstallWizardFragment downloads the companion APK directly
// from a GitHub release at wizard-run time instead (see InstallTarget.downloadUrl in
// the library module's InstallWizardFragment.kt). Nothing here needs to know about UserLAnd-VM/
// UserLAnd-QEMU's local checkouts anymore.

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.0.2'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'

    implementation project(':library')
}
