plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'de.undercouch.download'
}

android {
    namespace 'tech.anl.library'

    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // Every app-specific setting lives in :CustomLibrary's BuildConfig, keyed by these flavors.
    // The names must match the host app's and :CustomLibrary's "app" flavors exactly, or Gradle
    // cannot resolve a variant of this module for them.
    flavorDimensions "app"
    productFlavors {
        ServerBox { dimension "app" }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        disable 'MissingTranslation'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kapt {
    correctErrorTypes true
}

// Support binaries (busybox, proot, pulseaudio, dbclient, ...) come from a published
// UserLAnd-Assets-Support release and ship as "fake .so" files in jniLibs, so the package
// manager extracts them to nativeLibraryDir where they are executable. The host app must keep
// useLegacyPackaging = true for that extraction to happen.
ext.architectures = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
ext.libDir = "$projectDir/src/main/jniLibs"
ext.supportAssetsVersion = rootProject.ext.has('support_assets_version') ? rootProject.ext.support_assets_version : 'v1.4.23'
ext.supportAssetsDir = "$buildDir/support-assets/$supportAssetsVersion"

tasks.register('downloadSupportAssets', Download) {
    def baseUrl = "https://github.com/CypherpunkArmory/UserLAnd-Assets-Support/releases/download/$supportAssetsVersion"
    src architectures.collect { "$baseUrl/$it-assets.zip" }
    dest supportAssetsDir
    overwrite false
    retries 3
}

tasks.register('fetchSupportAssets') {
    dependsOn 'downloadSupportAssets'
    inputs.property('version', supportAssetsVersion)
    outputs.dir(libDir)
    doLast {
        for (arch in architectures) {
            delete "$libDir/$arch"
            copy {
                from zipTree("$supportAssetsDir/$arch-assets.zip")
                into "$libDir/$arch"
                // Lib files must start with 'lib' and end with '.so'.
                rename '(.*)', 'lib_$1.so'
            }
            new File("$libDir/$arch", "lib_arch.so").text = "$arch"
            new File("$libDir/$arch", "lib_assets_version.so").text = "$supportAssetsVersion"
        }
    }
}

// Re-fetch when the jniLibs are missing or were fetched for a different support_assets_version.
def supportAssetsStale = architectures.any { arch ->
    def marker = new File("$libDir/$arch", "lib_assets_version.so")
    !marker.exists() || marker.text.trim() != supportAssetsVersion
}
if (supportAssetsStale) {
    preBuild.dependsOn 'fetchSupportAssets'
}

dependencies {
    def coroutines_version = '1.7.3'
    def room_version = '2.6.1'
    def lifecycle_version = '2.6.2'
    def okhttp_version = '4.12.0'
    def moshi_version = '1.15.0'

    api project(':CustomLibrary')
    implementation project(':terminal')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"

    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"
    implementation 'org.rauschig:jarchivelib:0.8.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // ADB client for the companion-app install wizard (wireless-debugging pairing + shell).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttp_version"

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation "androidx.room:room-testing:$room_version"
}
